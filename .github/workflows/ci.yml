name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning scripts/*.sh kali/entrypoint.sh kali/lib/color.sh \
            kali/bin/* seed/generate.sh
      - name: compose config
        run: docker compose config -q

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: docker compose build
