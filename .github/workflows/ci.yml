name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck -S warning scripts/*.sh kali/entrypoint.sh kali/lib/color.sh kali/lib/grade.sh kali/lib/trouble-run.sh \
            kali/bin/* seed/generate.sh seed/build-localrepo.sh grading/*/*.sh tests/solutions/*.sh scenarios/*.sh scenarios/bin/copycat-app.init
      - name: compose config
        run: docker compose config -q

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: build images
        run: docker compose build

  selftest:
    # Proves the environment works at runtime, not just that the images build.
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: start containers and wait until healthy
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: run copycat-selftest
        shell: bash   # explicit shell enables pipefail, so a failing selftest fails the step despite tee
        run: bash scripts/copycat-selftest.sh | tee selftest.log

      - name: collect diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp selftest.log diagnostics/ 2>/dev/null || true
          docker compose ps -a > diagnostics/ps.txt 2>&1 || true
          docker compose logs --no-color > diagnostics/containers.log 2>&1 || true
          docker inspect --format '{{.Name}} {{json .State.Health}}' copycat-kali copycat-target > diagnostics/health.txt 2>&1 || true

      - name: upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: copycat-diagnostics
          path: diagnostics/
          retention-days: 14

      - name: clean up
        if: always()
        run: docker compose down -v --remove-orphans
